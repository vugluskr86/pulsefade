<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#07070f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="./icons/icon-512.png" />
    <title>PULSEFADE</title>
  </head>
  <body>
    <main id="stage" aria-label="PULSEFADE">
      <canvas id="gl" aria-label="Игровое поле"></canvas>

      <section id="hud" class="hud" aria-live="polite">
        <div class="hud__top">
          <div class="readout">
            <span class="readout__label">score</span>
            <span class="readout__value" data-hud="score">0</span>
          </div>
          <div class="readout readout--right">
            <span class="readout__label">mult</span>
            <span class="readout__value" data-hud="multiplier">×1</span>
          </div>
        </div>
        <div class="timebar"><span class="timebar__fill" data-hud="time"></span></div>
        <div class="hud__mode" data-hud="mode">adaptive</div>
        <div class="grade" data-hud="grade"></div>
        <div class="hud__bottom">
          <div class="combo" data-hud="combo"></div>
          <div class="tape" data-hud="tape" aria-hidden="true"></div>
        </div>
        <button class="iconbtn" type="button" data-hud="menu" aria-label="Открыть меню">≡</button>
      </section>

      <section id="overlay" class="overlay" hidden></section>
      <aside id="debug" class="debug" hidden></aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
